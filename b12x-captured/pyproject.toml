[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "b12x"
version = "1.2.3"
description = "Captured B12X package from known-good image"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.12.0",
    "cuda-python",
    "nvidia-cutlass-dsl==4.7.0",
    "nvidia-cutlass-dsl-libs-base==4.7.0",
    "nvidia-cutlass-dsl-libs-core==4.7.0",
    "nvidia-cutlass-dsl-libs-cu12==4.7.0",
    "nvidia-cutlass-dsl-libs-cu13==4.7.0",
    "apache-tvm-ffi!=0.1.8,!=0.1.8.post0,<0.2,>=0.1.6",
    "rich>=13",
    "transformers>=4.51",
    "safetensors>=0.6",
]
[tool.setuptools.packages.find]
include = ["b12x*"]
